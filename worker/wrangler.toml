name = "climb15-reminder"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Every minute; the Worker sends at most one push per device per day.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "REMINDERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
# Your Pages origin(s), comma-separated. "*" allows any origin.
ALLOWED_ORIGIN = "https://climb15.pages.dev"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   VAPID_PUBLIC_KEY   base64url, 65-byte uncompressed P-256 point
#   VAPID_PRIVATE_KEY  base64url, 32-byte private scalar
